<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#0b0f19}canvas{display:block}</style></head>
<body>
<canvas id="c" width="1280" height="800"></canvas>
<script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';
import { GLTFLoader } from '/node_modules/three/examples/jsm/loaders/GLTFLoader.js';
import { OBJLoader } from '/node_modules/three/examples/jsm/loaders/OBJLoader.js';
import { PLYLoader } from '/node_modules/three/examples/jsm/loaders/PLYLoader.js';

const params = new URLSearchParams(location.search);
const url = params.get('file') || '/recon_output.glb';

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setSize(1280, 800, false);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0f19);
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const dl = new THREE.DirectionalLight(0xffffff, 1.2); dl.position.set(1, 2, 1); scene.add(dl);
const camera = new THREE.PerspectiveCamera(60, 1280 / 800, 0.1, 10000);

function frame(obj) {
  const bb = new THREE.Box3().setFromObject(obj);
  const size = bb.getSize(new THREE.Vector3());
  const center = bb.getCenter(new THREE.Vector3());
  obj.position.sub(center);
  const maxDim = Math.max(size.x, size.z, 20);
  camera.position.set(0, maxDim * 0.7, maxDim * 1.0);
  camera.lookAt(0, 0, 0);
  scene.add(obj);
  renderer.render(scene, camera);
  document.title = 'RENDERED';
  window.__done = true;
}

if (url.endsWith('.glb') || url.endsWith('.gltf')) {
  new GLTFLoader().load(url, (g) => frame(g.scene), undefined, (e) => { document.title = 'ERR'; console.error(e); });
} else if (url.endsWith('.obj')) {
  new OBJLoader().load(url, (o) => frame(o), undefined, (e) => { document.title = 'ERR'; console.error(e); });
} else {
  new PLYLoader().load(url, (g) => frame(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide }))), undefined, (e) => { document.title = 'ERR'; console.error(e); });
}
</script>
</body></html>
