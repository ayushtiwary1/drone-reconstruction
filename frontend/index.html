<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tactical 3D Recon Engine</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { display: flex; height: 100vh; background: #0b0f19; color: #e2e8f0; font-family: monospace; overflow: hidden; }
      
      /* Left Control Sidebar */
      #sidebar { width: 340px; background: #111827; border-right: 1px solid #1f2937; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; z-index: 10; }
      h2 { font-size: 1.1rem; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; }
      label { font-size: 0.75rem; color: #9ca3af; text-transform: uppercase; }
      input, select { width: 100%; background: #1f2937; border: 1px solid #374151; color: #fff; padding: 8px; border-radius: 4px; font-family: monospace; font-size: 0.8rem; }
      
      button { background: #0284c7; color: #fff; border: none; padding: 10px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
      button:hover { background: #0369a1; }
      
      /* Log Window */
      #log-box { flex-grow: 1; background: #030712; border: 1px solid #1f2937; padding: 10px; border-radius: 4px; font-size: 0.75rem; color: #4ade80; overflow-y: auto; white-space: pre-wrap; }
      
      /* Export Buttons */
      .export-btn { text-align: center; background: #1f2937; border: 1px solid #374151; color: #38bdf8; padding: 6px 0; font-size: 0.72rem; text-decoration: none; border-radius: 4px; font-weight: bold; display: block; transition: background 0.2s, border-color 0.2s, color 0.2s; }
      .export-btn:hover { background: #0284c7; color: #fff; border-color: #38bdf8; }

      /* Right 3D Viewport */
      #viewport { flex-grow: 1; position: relative; width: calc(100vw - 340px); height: 100vh; }
      #canvas3d { width: 100%; height: 100%; display: block; }

      /* [demo] lasso overlay */
      #lassoCanvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
      #lassoCanvas.active { cursor: crosshair; }

      /* [demo] selection toolbar */
      #selToolbar { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; z-index: 8; }
      #selToolbar button { background: #1f2937; border: 1px solid #374151; color: #cbd5e1; padding: 6px 10px; font-size: 0.72rem; }
      #selToolbar button:hover { background: #374151; color: #fff; }
      #selToolbar button.on { border-color: #f59e0b; color: #f59e0b; }

      /* [demo] filmstrip */
      #filmstrip { position: absolute; left: 0; right: 0; bottom: 0; display: none; gap: 6px; padding: 6px; overflow-x: auto; background: rgba(17,24,39,0.92); border-top: 1px solid #1f2937; z-index: 7; }
      .fs-cell { position: relative; flex: 0 0 auto; width: 110px; border: 2px solid transparent; border-radius: 4px; overflow: hidden; cursor: pointer; background: #0b0f19; }
      .fs-cell img { width: 110px; height: 62px; object-fit: cover; display: block; }
      .fs-label { font-size: 0.6rem; color: #94a3b8; text-align: center; padding: 2px 0; }
      .fs-badge { position: absolute; top: 2px; right: 2px; background: rgba(2,132,199,0.9); color: #fff; font-size: 0.55rem; padding: 1px 4px; border-radius: 3px; }
      .fs-cell.sel { border-color: #22d3ee; }
      .fs-cell.exc { border-color: #ef4444; }
      .fs-cell.exc img { opacity: 0.35; }
      .fs-cell.exc::after { content: 'EXC'; position: absolute; top: 2px; left: 2px; color: #ef4444; font-size: 0.55rem; font-weight: bold; }

      /* [demo] toast */
      #toast { position: absolute; bottom: 110px; left: 50%; transform: translateX(-50%); background: #1f2937; border: 1px solid #22d3ee; color: #e2e8f0; padding: 8px 16px; border-radius: 4px; font-size: 0.75rem; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 9; }
      #toast.show { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="sidebar">
      <h2>3D Recon Engine</h2>
      <p style="font-size: 0.7rem; color: #38bdf8;">Single-Pass UAV Aerial Mapping</p>

      <div>
        <label>1. Drone Video (.mp4 / 1080p+)</label>
        <input type="file" id="videoFile" accept="video/mp4" />
      </div>

      <div>
        <label>2. Telemetry / GPS (.csv / .srt)</label>
        <input type="file" id="telemetryFile" accept=".csv, .srt" />
      </div>

      <div>
        <label>3. Hardware Profile</label>
        <select id="profileSelect">
          <option value="edge_fast">Edge Fast (RTX 2050 4GB / Low VRAM)</option>
          <option value="balanced" selected>Balanced (8GB VRAM / Detailed)</option>
          <option value="high_accuracy">High Accuracy (16GB+ VRAM / Dense)</option>
        </select>
      </div>

      <div>
        <label>3b. Camera Angle</label>
        <select id="cameraAngleSelect">
          <option value="auto" selected>Auto (telemetry gimbal pitch)</option>
          <option value="-90">Nadir (-90°)</option>
          <option value="-60">-60°</option>
          <option value="-45">-45° (Standard Oblique)</option>
          <option value="-30">-30°</option>
          <option value="-20">-20°</option>
        </select>
      </div>

      <div style="margin: 4px 0;">
        <label style="display: flex; justify-content: space-between; font-size: 12px;">
          <span>3c. Clock offset s (blank = auto-estimate):</span>
        </label>
        <input id="syncOffsetInput" type="text" inputmode="decimal" placeholder="auto" style="width:100%; box-sizing:border-box; margin-bottom:10px;" />
      </div>

      <div style="margin: 4px 0;">
        <label style="display: flex; justify-content: space-between; font-size: 12px;">
          <span>3d. View Mode:</span>
        </label>
        <select id="viewModeSelect">
          <option value="mesh" selected>Textured Mesh (Full HD)</option>
          <option value="points">Point Cloud</option>
        </select>
      </div>

      <div>
        <label>Reconstruction Progress</label>
        <progress id="recon-progress" value="0" max="100" style="width:100%; height:8px; accent-color:#0284c7;"></progress>
      </div>

      <div style="margin: 8px 0;">
        <label style="display: flex; justify-content: space-between; font-size: 12px;">
          <span>4. Point Clarity / Size:</span>
          <span id="pointSizeVal" style="color: #38bdf8; font-weight: bold;">2.0px</span>
        </label>
        <input type="range" id="pointSizeSlider" min="1.0" max="4.0" step="0.5" value="2.0" style="width:100%; accent-color:#0284c7;" />
      </div>

      <button id="runBtn">START RECONSTRUCTION</button>

      <div id="exportSection" style="margin: 4px 0 6px 0;">
        <label style="font-size: 0.72rem; color: #94a3b8; display: block; margin-bottom: 4px;">Export Formats</label>
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 4px;">
          <a id="downloadPly" href="/recon_output.ply" download="recon_output.ply" class="export-btn">📥 PLY</a>
          <a id="downloadObj" href="/recon_output.obj" download="recon_output.obj" class="export-btn">📥 OBJ</a>
          <a id="downloadLas" href="/recon_output.las" download="recon_output.las" class="export-btn">📥 LAS</a>
          <a id="downloadGlb" href="/recon_output.glb" download="recon_output.glb" class="export-btn">📥 GLB</a>
        </div>
      </div>

      <label>System Output & Telemetry Log</label>
      <div id="log-box">[SYSTEM INITIALIZED] Standing by for video payload...</div>
    </div>

    <div id="viewport">
      <canvas id="canvas3d"></canvas>
      <canvas id="lassoCanvas"></canvas>
      <div id="selToolbar">
        <button id="lassoBtn" title="Draw a region (L)">Lasso (L)</button>
        <button id="regenBtn" title="Fill excluded-frame points from neighbours">Regen region</button>
        <button id="rebuildBtn" title="Re-run pipeline on selected frames">Rebuild frames</button>
        <button id="undoBtn" title="Restore previous buffers">Undo</button>
        <button id="clearBtn" title="Clear selection (Esc)">Clear</button>
      </div>
      <div id="filmstrip"></div>
      <div id="toast"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
